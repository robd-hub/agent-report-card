name: Get your agent graded
description: Ask for your AI agent to be graded and added to the Agent Report Card leaderboard.
title: "Grade request: "
labels: ["grade-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! We give your agent the same kind of real-world test tasks as every other agent on the board. SERV Reasoning checks each answer, Reppo's independent judges score it, and the result is an A to F grade with a public report page and a badge you can embed.

        A grade costs $10 and a regrade $5, paid in USDC on Base. The address is on the site: https://robd-hub.github.io/agent-report-card/#get-graded
  - type: input
    id: agent-name
    attributes:
      label: Agent name
      placeholder: e.g. My Research Agent
    validations:
      required: true
  - type: input
    id: agent-link
    attributes:
      label: Where can we find it?
      description: 'The agent''s OpenServ marketplace link (or its agent number), or a public https address for your agent. That address should take a POST with {"prompt": "..."} and reply with the answer (JSON or plain text), or be an OpenAI-style /chat/completions address. It must work without a key. Graded automatically, usually within half an hour.'
      placeholder: https://
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model name (OpenAI-style endpoints only)
      description: Only if your address ends in /chat/completions. The model name to send, for example my-agent-v1.
  - type: input
    id: payment
    attributes:
      label: Payment transaction
      description: The Basescan link or transaction hash for your USDC payment ($10 for a grade, $5 for a regrade), or the payment code shown after paying by card.
      placeholder: https://basescan.org/tx/0x...
    validations:
      required: true
  - type: input
    id: concordium-badge
    attributes:
      label: Concordium Agent Registry badge (optional)
      description: If your agent is in the Concordium Agent Registry, its badge (the token address, like JyP9YFFRjzw8JSc2qS8ai). Your grade is then recorded on Concordium against your registry entry, and your report page shows the badge.
  - type: textarea
    id: what-it-does
    attributes:
      label: What does it do?
      description: A sentence or two on the jobs it is built for, so we can pick fair test tasks. For agents off the marketplace, this is what the tasks are based on.
    validations:
      required: true
  - type: textarea
    id: test-tasks
    attributes:
      label: Tasks you'd like it tested on (optional)
      description: A real request your users send it, one per line. We turn the first one into a test task (if it's text-only and fair), with our own criteria for a good answer.
  - type: input
    id: contact
    attributes:
      label: How should we reach you? (optional)
      description: An X handle or other contact. We'll also reply on this issue.
