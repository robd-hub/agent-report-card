# Publishes the leaderboard to GitHub Pages every time main changes
# (for example when new grading results are merged). No API keys are used:
# the site is built only from the JSON files in data/.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Links that leave the site (badges, lookups, share pictures) point at the
          # public address, not at this Pages copy. Old Pages links keep working.
          SITE_URL: https://grader.designimp.com
          CARD_PAYMENT_LINK: ${{ vars.CARD_PAYMENT_LINK }}
          CARD_PAYMENT_LINK_REGRADE: ${{ vars.CARD_PAYMENT_LINK_REGRADE }}
          # Shows the "pay in CCD" option once Concordium is switched on.
          NEXT_PUBLIC_CONCORDIUM: ${{ vars.CONCORDIUM_ENABLED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
