# Publishes a builder's reply to their grade (see scripts/builder-reply.ts).
# A reply goes up only after the maintainer adds the "reply-approved" label to
# a "Reply to a grade" issue, having checked the builder's link. Labels can
# only be added by people with write access to the repository.
name: Publish builder replies

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: builder-reply
  cancel-in-progress: false

jobs:
  # Makes sure the labels exist (an issue form can't add a missing label) and tells the builder what happens next.
  received:
    if: github.event.action == 'opened' && startsWith(github.event.issue.title, 'Builder reply')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create builder-reply --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "A builder's reply to their grade" 2>/dev/null || true
          gh label create reply-approved --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Maintainer checked the builder; publish the reply" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label builder-reply
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Thanks! We'll check the link that shows you built the agent, usually within a day, and then your reply goes on its report page. We'll comment here when it's up."

  publish:
    if: github.event.action == 'labeled' && github.event.label.name == 'reply-approved' && startsWith(github.event.issue.title, 'Builder reply')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: reply
        name: Publish the reply
        run: npx tsx scripts/builder-reply.ts
        env:
          # Environment variables, never pasted into the script: the issue text is untrusted.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
      - name: Save
        id: save
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "agent-report-card-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/replies.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Builder reply #${ISSUE_NUMBER}"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Answer on the issue
        if: always() && steps.reply.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.reply.outputs.outcome }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"
          fi
          if [ "$OUTCOME" = "published" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Republish the site
        if: steps.save.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
