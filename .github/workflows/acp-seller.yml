# Sells grades on Virtuals' Agent Commerce Protocol (ACP). Started by the
# watcher (acp-watch.yml) as soon as a job needs it, plus hourly as a backup.
# scripts/acp-seller.ts catches up on the agent's jobs: it sets a budget on new
# requests, grades one funded job, and submits finished reports (which releases
# the buyer's USDC from escrow to the agent's wallet).
#
# Stays off until the repository variable ACP_WALLET_ADDRESS is set
# (Settings > Secrets and variables > Actions > Variables). Also needs:
#   variable ACP_WALLET_ID, secret ACP_SIGNER_PRIVATE_KEY (both from the agent's
#   Signers tab on app.virtuals.io), optional variable ACP_BUILDER_CODE,
#   and the grader's secrets SERV_API_KEY, REPPO_API_KEY, OPENSERV_USER_API_KEY.
name: Sell grades on Virtuals

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

# Shares the auto-grade queue: both commit to main and spend Reppo credits.
concurrency:
  group: auto-grade
  cancel-in-progress: false

jobs:
  sell:
    if: vars.ACP_WALLET_ADDRESS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACP_WALLET_ADDRESS: ${{ vars.ACP_WALLET_ADDRESS }}
      ACP_WALLET_ID: ${{ vars.ACP_WALLET_ID }}
      ACP_BUILDER_CODE: ${{ vars.ACP_BUILDER_CODE }}
      ACP_SIGNER_PRIVATE_KEY: ${{ secrets.ACP_SIGNER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: sell
        name: Handle jobs and grade one
        run: npx tsx scripts/acp-seller.ts
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
          REPPO_API_KEY: ${{ secrets.REPPO_API_KEY }}
          OPENSERV_USER_API_KEY: ${{ secrets.OPENSERV_USER_API_KEY }}

      - id: save
        name: Save results
        if: always()
        run: |
          git config user.name "agent-report-card-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Virtuals jobs ${JOB:-update}"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          JOB: ${{ steps.sell.outputs.job }}

      - name: Flag a job for the maintainer
        if: steps.sell.outputs.outcome == 'needs-attention'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.sell.outputs.job }}
        run: |
          gh label create needs-attention --repo "$GITHUB_REPOSITORY" --color D93F0B --description "The grading bot needs the maintainer" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label needs-attention \
            --title "Virtuals job $JOB needs attention" \
            --body "The grader couldn't finish paid Virtuals job $JOB on its own. Nothing was submitted, so the buyer is refunded when the job expires unless it's finished by hand first. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # A push made with the workflow's own token doesn't start other
      # workflows, so start the site build directly, wait for it, then submit.
      - name: Republish the site and submit the report
        if: steps.sell.outputs.outcome == 'graded' && steps.save.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 20
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || true
          git pull --rebase origin main
          npx tsx scripts/acp-seller.ts submit
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Virtuals job submitted"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
