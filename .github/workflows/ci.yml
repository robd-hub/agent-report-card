# Runs on pull requests: the test suite, a typecheck, the static GitHub Pages
# build, and the Vercel server build (lookup, MCP, live badge).
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pages:
    name: Pages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: /agent-report-card
          SITE_URL: https://robd-hub.github.io/agent-report-card

  vercel:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VERCEL: "1"
      - run: npm run check:slash
